<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaktija</title>
<meta name="theme-color" content="#0F1C33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"Red Hat Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Times New Roman",serif;
  /* admin tokens (light) */
  --bg:#F3F5F9; --surface:#FFFFFF; --line:#D8DEE8; --ink:#16233B; --ink-2:#55627A;
  --accent:#1F7F79; --accent-ink:#FFFFFF; --warn:#B4472F; --ok:#1F7F79;
  /* signage palette, fixed in both themes */
  --night:#13213A; --night-2:#1A2C4C; --night-3:#24395E; --stone:#F2EEE6; --mist:#8FA0BC;
  --iznik:#3FB8AF; --gold:#D9B45B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#16213A; --line:#2A3A5C; --ink:#E9EDF5; --ink-2:#9AA8C2;
    --accent:#3FB8AF; --accent-ink:#0E1626; --warn:#E88B72; --ok:#3FB8AF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#16213A; --line:#2A3A5C; --ink:#E9EDF5; --ink-2:#9AA8C2;
  --accent:#3FB8AF; --accent-ink:#0E1626; --warn:#E88B72; --ok:#3FB8AF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body{background:#0F1C33}
/* ---------- display ---------- */
.display{position:fixed;inset:0;overflow:hidden;background:#0F1C33;color:#F4EFE4;font-family:var(--sans);font-variant-numeric:tabular-nums}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:#0F1C33}
.stage.p{width:1080px;height:1920px}
.girih{position:absolute;inset:0;width:100%;height:100%;opacity:.06;pointer-events:none}
.frame1{position:absolute;inset:24px;border:1.5px solid rgba(212,175,95,.45);pointer-events:none}
.frame2{position:absolute;inset:34px;border:1px solid rgba(212,175,95,.22);pointer-events:none}
.corner{position:absolute;width:44px;height:44px}
.corner.tl{left:7px;top:7px}.corner.tr{right:7px;top:7px}.corner.bl{left:7px;bottom:7px}.corner.br{right:7px;bottom:7px}
.inner{position:relative;height:100%;box-sizing:border-box;padding:62px 76px 58px;display:grid;grid-template-rows:auto 1fr auto auto;gap:26px}
.stage.p .inner{padding:70px 64px 62px;display:flex;flex-direction:column;gap:34px}

.head-l{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:32px}
.head-l .name{font-size:44px;font-weight:700;line-height:1.05}
.head-l .city{font-size:24px;color:#93A3BF;margin-top:6px}
.bism{font-family:var(--arabic);color:#93A3BF;direction:rtl;line-height:1.4}
.head-l .bism{font-size:40px;padding-top:4px}
.head-l .dates{text-align:right}
.head-l .greg{font-size:30px;font-weight:500}
.head-l .hij{font-size:23px;color:#93A3BF;margin-top:6px}
.head-l .hij-ar{font-family:var(--arabic);font-size:32px;color:#D4AF5F;direction:rtl;margin-top:2px}
.head-p{display:none;flex-direction:column;align-items:center;text-align:center;gap:12px}
.head-p .bism{font-size:34px}
.head-p .row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.head-p .name{font-size:36px;font-weight:700;line-height:1.1}
.head-p .city{font-size:28px;color:#93A3BF;line-height:1.1}
.head-p .dates{margin-top:14px;font-size:28px}
.head-p .greg{font-weight:500}
.head-p .hij{color:#93A3BF}
.dot{width:6px;height:6px;border-radius:50%;background:#D4AF5F;flex-shrink:0}
.head-p .top{display:flex;flex-direction:column;align-items:center;gap:36px}
.stage.p .head-l{display:none}
.stage.p .head-p{display:flex}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0}
.clock{font-size:124px;font-weight:900;line-height:.86;letter-spacing:-.03em}
.stage.p .clock{line-height:.88}
.clock .sec{color:#93A3BF}
.pill{display:flex;align-items:center;gap:15px;padding:9px 27px 11px;border-radius:999px;border:1px solid rgba(212,175,95,.45);background:rgba(212,175,95,.08)}
.pill-l{font-size:23px;color:#D4AF5F}
.pill-c{font-size:37px;font-weight:700;color:#D4AF5F}
.tline{width:1000px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;margin-top:6px}
.stage.p .tline{width:auto;grid-template-columns:auto 160px auto;gap:20px;margin-top:4px}
.tl-lab{font-size:22px;color:#93A3BF;white-space:nowrap}
.stage.p .tl-lab{font-size:24px}
.tl-lab b{color:#F4EFE4;font-weight:700}
.track{position:relative;height:6px;border-radius:3px;background:#22375C}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#D4AF5F}
.track .knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#0F1C33;border:3px solid #D4AF5F;box-sizing:border-box}

.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;height:300px}
.card{position:relative;height:300px}
.card svg{position:absolute;inset:0;width:100%;height:100%}
.card .inline{padding:10px;box-sizing:border-box}
.card .shape{fill:#172947}
.card .edge{fill:none;stroke:rgba(212,175,95,.28);stroke-width:1}
.card .cc{position:relative;height:100%;box-sizing:border-box;padding:56px 12px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.card .ar{font-family:var(--arabic);font-size:50px;line-height:1.2;color:#F4EFE4}
.card .bs{font-size:27px;font-weight:500;color:#93A3BF;margin-top:2px}
.card .tm{font-size:76px;font-weight:700;line-height:1.05;margin-top:6px;color:#F4EFE4}
.card.minor .tm{color:#93A3BF}
.card.current .shape{fill:#1E3459}
.card.current .edge{stroke:rgba(73,185,174,.55)}
.card.current .bs{color:#A9B7CF}
.card.next .shape{fill:#D4AF5F}
.card.next .edge{stroke:rgba(15,28,51,.35)}
.card.next .ar,.card.next .bs,.card.next .tm{color:#0F1C33}

.rows{display:none;flex-direction:column;gap:14px;flex:1;justify-content:center}
.stage.p .cards{display:none}
.stage.p .rows{display:flex}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;column-gap:28px;height:124px;padding:0 38px 0 30px;border-radius:14px;background:#172947;box-sizing:border-box}
.prow svg{justify-self:center}
.prow .med{fill:none;stroke:rgba(212,175,95,.55)}
.prow .bs{font-size:44px;font-weight:500;color:#F4EFE4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ar{font-family:var(--arabic);font-size:50px;color:#A9B7CF}
.prow .tm{font-size:84px;font-weight:700;line-height:1;color:#F4EFE4;min-width:4.4ch;text-align:right}
.prow.minor .tm{color:#93A3BF}
.prow.current{background:#1E3459}
.prow.current .med{stroke:#49B9AE}
.prow.next{background:#D4AF5F}
.prow.next .med{stroke:#0F1C33}
.prow.next .bs,.prow.next .ar,.prow.next .tm{color:#0F1C33}

.notes-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:22px;min-height:78px;padding:0 28px;border-radius:8px;background:rgba(255,255,255,.2);box-sizing:border-box}
.notes-bar .n-top{display:contents}
.chip{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;background:#0F1C33;color:#D4AF5F;grid-column:1;grid-row:1}
.chip svg{width:22px;height:22px}
.notes-bar .dots{display:flex;gap:8px;grid-column:3;grid-row:1}
.dots span{width:8px;height:6px;border-radius:3px;background:rgba(244,239,228,.45);transition:width .4s ease,background .4s ease}
.dots span.on{width:22px;background:#F4EFE4}
.n-text{grid-column:2;grid-row:1;font-size:32px;font-weight:600;line-height:1.25;color:#F4EFE4;padding:10px 0;box-sizing:border-box;transition:opacity .6s ease;overflow-wrap:anywhere}
.n-text.out{opacity:0}
.stage.p .notes-bar{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:22px 30px 24px;background:rgba(255,255,255,.35)}
.stage.p .notes-bar .n-top{display:flex;align-items:center;justify-content:space-between}
.stage.p .n-text{font-size:36px;line-height:1.3;padding:0}

.announce{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:120px;background:rgba(15,28,51,.97);text-align:center}
.announce div{font-size:88px;font-weight:700;line-height:1.15;max-width:22ch}
.announce div::after{content:"";display:block;width:220px;height:5px;border-radius:3px;background:#D4AF5F;margin:44px auto 0}
.stage.p .announce div{font-size:80px}

.d-night{position:absolute;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none;transition:opacity 4s ease}
.d-status{position:absolute;left:16px;bottom:8px;z-index:8;font-size:12px;color:#93A3BF;opacity:.7}
.d-corner{position:absolute;right:16px;bottom:12px;z-index:9;display:flex;gap:8px;opacity:0;transition:opacity .3s;pointer-events:none}
.d-corner.show{opacity:1;pointer-events:auto}
.d-corner button{display:grid;place-items:center;width:40px;height:40px;padding:0;background:rgba(36,57,94,.55);border:0;color:#93A3BF;border-radius:8px;cursor:pointer}
.d-corner button:hover{color:#F4EFE4;background:#24395E}

@media (prefers-reduced-motion:reduce){.n-text,.d-corner,.dots span,.d-night{transition:none}}
</style>
</head>
<body>
<section id="display" class="display">
  <div class="stage" id="stage">
    <svg class="girih" aria-hidden="true"><defs><pattern id="girih" width="96" height="96" patternUnits="userSpaceOnUse"><g fill="none" stroke="#F4EFE4" stroke-width="1"><rect x="24" y="24" width="48" height="48"/><rect x="24" y="24" width="48" height="48" transform="rotate(45 48 48)"/><circle cx="48" cy="48" r="11"/><path d="M0 48h13M83 48h13M48 0v13M48 83v13"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#girih)"/></svg>
    <div class="frame1"></div><div class="frame2"></div>
    <svg class="corner tl" viewBox="0 0 44 44" aria-hidden="true"><g fill="#0F1C33" stroke="#D4AF5F" stroke-width="1.5"><rect x="10" y="10" width="24" height="24"/><rect x="10" y="10" width="24" height="24" transform="rotate(45 22 22)"/></g><circle cx="22" cy="22" r="3" fill="#D4AF5F"/></svg>
    <svg class="corner tr" viewBox="0 0 44 44" aria-hidden="true"><g fill="#0F1C33" stroke="#D4AF5F" stroke-width="1.5"><rect x="10" y="10" width="24" height="24"/><rect x="10" y="10" width="24" height="24" transform="rotate(45 22 22)"/></g><circle cx="22" cy="22" r="3" fill="#D4AF5F"/></svg>
    <svg class="corner bl" viewBox="0 0 44 44" aria-hidden="true"><g fill="#0F1C33" stroke="#D4AF5F" stroke-width="1.5"><rect x="10" y="10" width="24" height="24"/><rect x="10" y="10" width="24" height="24" transform="rotate(45 22 22)"/></g><circle cx="22" cy="22" r="3" fill="#D4AF5F"/></svg>
    <svg class="corner br" viewBox="0 0 44 44" aria-hidden="true"><g fill="#0F1C33" stroke="#D4AF5F" stroke-width="1.5"><rect x="10" y="10" width="24" height="24"/><rect x="10" y="10" width="24" height="24" transform="rotate(45 22 22)"/></g><circle cx="22" cy="22" r="3" fill="#D4AF5F"/></svg>

    <div class="inner">
      <header>
        <div class="head-l">
          <div><div class="name" data-f="name"></div><div class="city" data-f="city"></div></div>
          <div class="bism">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
          <div class="dates"><div class="greg" data-f="greg"></div><div class="hij" data-f="hij"></div><div class="hij-ar" data-f="hijar"></div></div>
        </div>
        <div class="head-p">
          <div class="top">
            <div class="bism">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
            <div class="row"><div class="name" data-f="name"></div><span class="dot" data-f="citydot"></span><div class="city" data-f="city"></div></div>
          </div>
          <div class="row dates"><span class="greg" data-f="greg"></span><span class="dot"></span><span class="hij" data-f="hij"></span></div>
        </div>
      </header>

      <section class="center">
        <div class="clock" id="dClock"></div>
        <div class="pill"><span class="pill-l" id="dNextLabel"></span><span class="pill-c" id="dNextCount"></span></div>
        <div class="tline">
          <div class="tl-lab" id="tlPrev"></div>
          <div class="track"><div class="fill" id="tlFill"></div><div class="knob" id="tlKnob"></div></div>
          <div class="tl-lab" id="tlNext"></div>
        </div>
      </section>

      <div class="cards" id="dCards"></div>
      <div class="rows" id="dRows"></div>

      <div class="notes-bar" id="dTicker">
        <div class="n-top">
          <div class="chip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></div>
          <div class="dots" id="dDots" aria-hidden="true"></div>
        </div>
        <div class="n-text" id="dTickerText"></div>
      </div>
    </div>
    <div class="announce" id="dAnnounce" hidden><div id="dAnnounceText"></div></div>
  </div>
  <div class="d-night" id="dNight"></div>
  <div class="d-status" id="dStatus"></div>
  <div class="d-corner" id="dCorner">
    <button id="btnFull" type="button" aria-label="Cijeli ekran" title="Cijeli ekran">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</section>

<script src="/shared.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
let config = normalize(JSON.parse(store.get(CACHE_KEY) || "null"));
let connected = false;
// per-screen layout from the link: ?raspored=horizontalno | vertikalno | rotirano
const forcedOrient = {horizontalno:"landscape", vertikalno:"portrait", rotirano:"rotate"}[new URLSearchParams(location.search).get("raspored")] || null;

/* ---------------- display ---------------- */
let tickTimer = null, noteTimer = null, noteIdx = 0, cornerTimer = null, wakeLock = null;
let renderedDay = "", times = null, tomorrowFajr = null, yesterdayIsha = null;
let lastSignature = "", lastMinute = -1;
const MED_SVG = '<svg width="44" height="58" viewBox="0 0 44 58" aria-hidden="true"><path class="med" d="M2 57 V22 C2 13 14 7 22 2 C30 7 42 13 42 22 V57" stroke-width="1.6"/><g class="med" stroke-width="1.3"><rect x="16" y="26" width="12" height="12"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)"/></g></svg>';

function buildCards(){
  const cards = $("dCards"), rows = $("dRows");
  cards.textContent = ""; rows.textContent = "";
  for (const k of KEYS){
    const c = document.createElement("div");
    c.className = "card" + (k === "sunrise" ? " minor" : "");
    c.dataset.key = k;
    c.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="shape" d="M0 100 V40 C0 22 28 10 50 0 C72 10 100 22 100 40 V100 Z"/></svg>' +
      '<svg class="inline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="edge" d="M0 100 V40 C0 22 28 10 50 0 C72 10 100 22 100 40 V100" vector-effect="non-scaling-stroke"/></svg>' +
      '<div class="cc"><div class="ar"></div><div class="bs"></div><div class="tm"></div></div>';
    cards.appendChild(c);
    const r = document.createElement("div");
    r.className = "prow" + (k === "sunrise" ? " minor" : "");
    r.dataset.key = k;
    r.innerHTML = MED_SVG + '<div class="bs"></div><div class="ar"></div><div class="tm"></div>';
    rows.appendChild(r);
  }
}
const allPrayerEls = k => document.querySelectorAll(`#dCards [data-key="${k}"], #dRows [data-key="${k}"]`);
function isFriday(d){ return d.getDay() === 5; }
function nameFor(k, d){ return (k === "dhuhr" && isFriday(d)) ? NAMES.jumuah : NAMES[k]; }
function setField(f, text){ document.querySelectorAll(`#display [data-f="${f}"]`).forEach(e => { e.textContent = text; }); }

/* layout: the board is drawn at a fixed design size and scaled to the screen */
function layoutStage(){
  const d = $("display"), st = $("stage");
  if (d.hidden) return;
  const vw = d.clientWidth || window.innerWidth, vh = d.clientHeight || window.innerHeight;
  const o = forcedOrient || config.orientation || "auto";
  const rotate = o === "rotate";
  const portrait = rotate || o === "portrait" || (o === "auto" && vh > vw);
  if (st.classList.contains("p") !== portrait){ st.classList.toggle("p", portrait); fitNotes(); }
  const W = portrait ? 1080 : 1920, H = portrait ? 1920 : 1080;
  const visW = rotate ? H : W, visH = rotate ? W : H;
  const s = Math.min(vw / visW, vh / visH);
  st.style.transform = `translate(-50%, -50%) ${rotate ? "rotate(90deg) " : ""}scale(${s})`;
}
window.addEventListener("resize", layoutStage);
// text is measured with the real fonts once they have loaded
if (document.fonts){ document.fonts.ready.then(fitNotes); document.fonts.addEventListener("loadingdone", fitNotes); }

function renderStatic(now){
  const cfg = config;
  layoutStage();
  setField("name", cfg.masjidName || "");
  setField("city", cfg.city || "");
  document.querySelectorAll('#display [data-f="citydot"]').forEach(e => { e.hidden = !(cfg.city || "").trim(); });
  setField("greg", gregorian(now));
  const h = hijri(now, +cfg.hijriAdjust);
  setField("hij", h ? `${h.day}. ${H_MONTHS[h.mon-1]} ${h.yr}. h.` : "");
  setField("hijar", h ? `${toArabicDigits(h.day)} ${H_MONTHS_AR[h.mon-1]} ${toArabicDigits(h.yr)} هـ` : "");
  times = dayTimes(now, cfg);
  const tm = new Date(now); tm.setDate(tm.getDate()+1);
  tomorrowFajr = dayTimes(tm, cfg).fajr.date;
  const yd = new Date(now); yd.setDate(yd.getDate()-1);
  yesterdayIsha = dayTimes(yd, cfg).isha.date;
  for (const k of KEYS){
    const n = nameFor(k, now);
    allPrayerEls(k).forEach(el => {
      el.querySelector(".ar").textContent = n.ar;
      el.querySelector(".bs").textContent = n.bs;
      el.querySelector(".tm").textContent = minToHHMM(times[k].min);
    });
  }
  const ann = cfg.announcement || {};
  $("dAnnounce").hidden = !(ann.on && (ann.text||"").trim());
  $("dAnnounceText").textContent = (ann.text||"").trim();
  renderedDay = dateKey(now);
  lastSignature = contentSignature(now);
  restartNotes();
}

/* scheduled notes */
function contentSignature(now){ return JSON.stringify((config.notes||[]).map(n => noteActive(n, now))); }
function tickerItems(now){ return (config.notes||[]).filter(n => noteActive(n, now)).map(n => n.text.trim()); }

/* night */
function nightActive(now){
  const n = config.night || {};
  if (!n.on || !times) return false;
  const start = new Date(times.isha.date.getTime() + (+n.afterIsha||0)*60000);
  const end = new Date(times.fajr.date.getTime() - (+n.beforeFajr||0)*60000);
  return now >= start || now < end;
}

function fmtCount(ms){
  const s = Math.max(0, Math.ceil(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function tick(){
  const now = new Date();
  if (dateKey(now) !== renderedDay || !times) renderStatic(now);
  const clock = $("dClock");
  clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (config.showSeconds){ const s = document.createElement("span"); s.className = "sec"; s.textContent = ":" + pad(now.getSeconds()); clock.append(s); }

  const events = KEYS.map(k => ({k, at:times[k].date}));
  const nextIdx = events.findIndex(e => e.at > now);
  const next = nextIdx === -1 ? {k:"fajr", at:tomorrowFajr} : events[nextIdx];
  const prev = nextIdx === -1 ? events[events.length-1] : (nextIdx === 0 ? {k:"isha", at:yesterdayIsha} : events[nextIdx-1]);

  $("dNextLabel").textContent = `${nameFor(next.k, next.at).bs} za`;
  $("dNextCount").textContent = fmtCount(next.at - now);

  const span = next.at - prev.at, pct = span > 0 ? Math.min(100, Math.max(0, (now - prev.at) / span * 100)) : 0;
  $("tlFill").style.width = pct.toFixed(2) + "%";
  $("tlKnob").style.left = pct.toFixed(2) + "%";
  const lab = (e) => { const d = document.createDocumentFragment(); d.append(nameFor(e.k, e.at).bs + " "); const b = document.createElement("b"); b.textContent = `${pad(e.at.getHours())}:${pad(e.at.getMinutes())}`; d.append(b); return d; };
  $("tlPrev").replaceChildren(lab(prev));
  $("tlNext").replaceChildren(lab(next));

  const currentKey = (nextIdx !== 0 && prev.k !== "sunrise") ? prev.k : null;
  for (const k of KEYS){
    allPrayerEls(k).forEach(el => {
      el.classList.toggle("next", k === next.k);
      el.classList.toggle("current", k === currentKey);
    });
  }
  // after jacija the zora card shows tomorrow's time
  const fajrMin = nextIdx === -1 ? tomorrowFajr.getHours()*60 + tomorrowFajr.getMinutes() : times.fajr.min;
  allPrayerEls("fajr").forEach(el => { el.querySelector(".tm").textContent = minToHHMM(fajrMin); });

  if (now.getMinutes() !== lastMinute){
    lastMinute = now.getMinutes();
    const sig = contentSignature(now);
    if (sig !== lastSignature){ lastSignature = sig; restartNotes(); }
  }
  const night = nightActive(now);
  $("dNight").style.opacity = night ? String(Math.min(.9, Math.max(0, (+config.night.level||0)/100))) : "0";
}
function drawDots(count, idx){
  const box = $("dDots"); box.textContent = "";
  box.hidden = count < 2;
  for (let i = 0; i < count; i++){ const s = document.createElement("span"); if (i === idx) s.className = "on"; box.append(s); }
}
// Long notes are shown in full: the text shrinks (to 65% at most) only when the board would
// otherwise run out of room. Size and height are set for the longest note, so the layout
// stays still while the notes rotate.
let shownNotes = [];
function boardFits(){
  const inner = document.querySelector("#stage .inner"), center = document.querySelector("#stage .center");
  return inner.scrollHeight <= inner.clientHeight + 1 && center.scrollHeight <= center.clientHeight + 1;
}
function fitNotes(){
  const text = $("dTickerText");
  if (!shownNotes.length || $("dTicker").hidden) return;
  const showing = text.textContent;
  text.style.fontSize = ""; text.style.minHeight = "";
  const full = parseFloat(getComputedStyle(text).fontSize), min = Math.round(full * .65);
  for (let size = full; ; size = Math.max(min, size - 2)){
    text.style.fontSize = size + "px";
    let tallest = shownNotes[0], tallestH = 0;
    for (const n of shownNotes){ text.textContent = n; if (text.offsetHeight > tallestH){ tallestH = text.offsetHeight; tallest = n; } }
    text.textContent = tallest;
    if (boardFits() || size === min){ text.style.minHeight = tallestH + "px"; break; }
  }
  text.textContent = showing;
}
function restartNotes(){
  clearInterval(noteTimer);
  const notes = tickerItems(new Date());
  const box = $("dTicker"), text = $("dTickerText");
  box.hidden = notes.length === 0;
  shownNotes = notes;
  if (!notes.length) return;
  noteIdx = noteIdx % notes.length;
  text.classList.remove("out");
  text.textContent = notes[noteIdx];
  fitNotes();
  drawDots(notes.length, noteIdx);
  if (notes.length < 2) return;
  const secs = Math.max(4, +config.noteSeconds || 10);
  noteTimer = setInterval(() => {
    text.classList.add("out");
    setTimeout(() => { noteIdx = (noteIdx+1) % notes.length; text.textContent = notes[noteIdx]; drawDots(notes.length, noteIdx); text.classList.remove("out"); }, 600);
  }, secs*1000);
}
function updateStatus(){
  $("dStatus").textContent = connected ? "" : "Van mreže · prikazuju se zadnje sačuvane postavke";
}
function startDisplay(){
  if (!$("dCards").children.length) buildCards();
  renderedDay = ""; tick();
  clearInterval(tickTimer);
  tickTimer = setInterval(tick, 1000);
  updateStatus();
  requestWake();
}
function stopDisplay(){ clearInterval(tickTimer); clearInterval(noteTimer); tickTimer = null; }
async function requestWake(){
  try{ if ("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } }catch(e){}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("display").hidden) requestWake(); });
["mousemove","touchstart","keydown"].forEach(ev => document.addEventListener(ev, () => {
  if ($("display").hidden) return;
  $("dCorner").classList.add("show");
  clearTimeout(cornerTimer);
  cornerTimer = setTimeout(() => $("dCorner").classList.remove("show"), 3000);
}, {passive:true}));


$("btnFull").onclick = () => {
  try{ (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); }catch(e){}
};

/* settings from the server: on start, then every 30 seconds */
async function refresh(){
  try{
    const next = await fetchSettings();
    connected = true;
    if (JSON.stringify(next) !== JSON.stringify(config)){
      config = next;
      store.set(CACHE_KEY, JSON.stringify(config));
      renderedDay = ""; tick(); layoutStage();
    }
  }catch(e){ connected = false; }
  updateStatus();
}
startDisplay();
refresh();
setInterval(refresh, 30000);
// reload once a night (03:30–05:00) so the screen picks up new versions of the page,
// but only when the server answers, so a dropped connection can't leave an error page on the TV.
// The check uses /api/settings because the service worker never answers for it.
const loadedAt = new Date();
let nightlyBusy = false;
async function nightlyReload(){
  const now = new Date(), due = new Date(now);
  due.setHours(3, 30, 0, 0);
  if (nightlyBusy || loadedAt >= due || now < due || now.getHours() >= 5) return;
  nightlyBusy = true;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
  try{
    const r = await fetch("/api/settings", {cache:"no-store", signal:ctl.signal});
    if (r.ok){ location.reload(); return; }
  }catch(e){}
  clearTimeout(timer);
  nightlyBusy = false;
}
setInterval(nightlyReload, 60000);
// keep a copy of the board so it can also start without internet (see sw.js)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
})();
</script>
