<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaktija · postavke</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" type="image/png" href="/admin/favicon.png">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<meta name="theme-color" content="#13213A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaktija">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"Red Hat Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Times New Roman",serif;
  /* admin tokens (light) */
  --bg:#F3F5F9; --surface:#FFFFFF; --line:#D8DEE8; --ink:#16233B; --ink-2:#55627A;
  --accent:#1F7F79; --accent-ink:#FFFFFF; --warn:#B4472F; --ok:#1F7F79;
  /* signage palette, fixed in both themes */
  --night:#13213A; --night-2:#1A2C4C; --night-3:#24395E; --stone:#F2EEE6; --mist:#8FA0BC;
  --iznik:#3FB8AF; --gold:#D9B45B;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#16213A; --line:#2A3A5C; --ink:#E9EDF5; --ink-2:#9AA8C2;
    --accent:#3FB8AF; --accent-ink:#0E1626; --warn:#E88B72; --ok:#3FB8AF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#16213A; --line:#2A3A5C; --ink:#E9EDF5; --ink-2:#9AA8C2;
  --accent:#3FB8AF; --accent-ink:#0E1626; --warn:#E88B72; --ok:#3FB8AF;
}
*,*::before,*::after{box-sizing:inherit}
/* <details> content does not inherit box-sizing through its slot, so set it directly */
details *,details *::before,details *::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* ---------- lock screen ---------- */
.chooser{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--night);color:var(--stone)}
.chooser-inner{max-width:520px;width:100%}
.chooser h1{font-weight:900;font-size:clamp(40px,8vw,64px);margin:0 0 4px;letter-spacing:-.02em}
.chooser p{color:var(--mist);line-height:1.5;margin:0 0 28px}

.pin-input{width:100%;box-sizing:border-box;padding:16px 18px;border-radius:12px;border:1px solid var(--night-3);background:var(--night-2);color:var(--stone);font-size:32px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.pin-input:focus{outline:3px solid var(--gold);outline-offset:2px}
.lock-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.lock-btn{flex:1;min-width:160px;padding:14px 18px;border-radius:12px;border:1px solid var(--night-3);background:var(--night-2);color:var(--stone);font-size:17px;font-weight:700;cursor:pointer}
.lock-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--night)}
.lock-btn[disabled]{opacity:.5;cursor:not-allowed}
.lock-check{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--mist);font-size:15px}
.lock-check input{width:20px;height:20px;accent-color:var(--gold)}
.lock-msg{min-height:22px;margin-top:14px;font-size:15px;color:#E88B72}

/* ---------- admin ---------- */
.admin{min-height:100%;background:var(--bg)}
.a-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--surface);border-bottom:1px solid var(--line)}
.a-bar-in{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.a-title{flex:1;min-width:0}
.a-bar h1{font-size:20px;margin:0;font-weight:900;line-height:1.2}
.a-title .sub{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn:not(.primary)[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:14px;min-height:36px}
.btn.danger{color:var(--warn)}
.m-show{display:none}
.a-conflict{margin:0 max(20px, calc((100% - 940px) / 2)) 12px;padding:12px 14px;box-sizing:border-box;border:1px solid var(--warn);border-radius:12px;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.a-conflict p{flex:1 1 320px;margin:0;font-size:14px;line-height:1.45;color:var(--ink)}
.a-conflict-btns{display:flex;flex-wrap:wrap;gap:8px}

/* layout: three tabs. Laptop: menu on the left. Phone: tab bar at the bottom of the screen. */
.a-layout{max-width:980px;margin:0 auto;padding:24px 20px 120px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.a-nav{position:sticky;top:calc(var(--bar-h,72px) + 16px);display:grid;gap:2px}
.a-nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-size:15px;font-weight:500;text-align:left;cursor:pointer}
.a-nav button svg{width:20px;height:20px;flex-shrink:0}
.a-nav button:hover{background:var(--surface);color:var(--ink)}
.a-nav button[aria-current="true"]{background:var(--line);color:var(--ink);font-weight:700}
.a-nav .dot-unsaved{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-left:auto}
.a-main{min-width:0}
.tab-head{margin:0 0 14px}
.tab-head h2{font-size:22px;margin:0;font-weight:900}
.tab-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.card > h3{font-size:16px;margin:0 0 2px}
.hint{font-size:14px;color:var(--ink-2);margin:0 0 14px;line-height:1.45}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:500}
.field input[type=text],.field input[type=number],.field input[type=time],.field input[type=date],.field select,.field textarea,.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.field textarea{min-height:90px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
input[type=range]{flex:1;accent-color:var(--accent)}

/* on/off switches: the whole row is the tap target */
.sw-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.sw-row.first,.card > h3 + .hint + .sw-row,.card > .sw-row:first-child{border-top:0}
.sw-row .txt{flex:1;min-width:0;display:grid;gap:2px}
.sw-row .t{font-weight:700;font-size:16px}
.sw-row .d{font-size:13px;color:var(--ink-2);line-height:1.4;overflow-wrap:anywhere}
.switch{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:50px;height:30px;margin:0;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}

/* today's prayer times: one row per prayer, tap to change it */
.plist{margin:0;padding:0}
.prow{border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow > summary{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 2px;cursor:pointer;list-style:none}
.prow > summary::-webkit-details-marker{display:none}
.prow .nm{flex:1;min-width:0}
.prow .nm b{font-size:17px}
.prow .nm .ar{font-family:var(--arabic);font-size:19px;color:var(--ink-2);margin-left:8px}
.prow .sub{display:block;font-size:13px;color:var(--ink-2)}
.prow .sub .mark{color:var(--accent);font-weight:700}
.prow .tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prow.minor .tm{font-size:21px;color:var(--ink-2)}
.prow.next .tm{color:var(--accent)}
.chev{width:18px;height:18px;color:var(--ink-2);flex-shrink:0;transition:transform .15s}
details[open] > summary .chev{transform:rotate(180deg)}
.pedit{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 2px 16px}
.pedit .lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.pedit .note{grid-column:1/-1;margin:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.timebox{display:flex;gap:6px}
.timebox .inp{min-width:0;flex:1 1 auto;width:0}
.timebox .btn{flex:0 0 44px;padding:0}
.stepper{display:flex}
.stepper button{flex:0 0 42px;min-height:44px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer;color:var(--ink)}
.stepper button:first-child{border-radius:10px 0 0 10px}
.stepper button:last-child{border-radius:0 10px 10px 0}
.stepper input{flex:1 1 auto;width:0;min-width:36px;border:1px solid var(--line);border-left:0;border-right:0;background:var(--bg);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* notes */
.notes{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.notes li,.note-item > *{min-width:0}
.note-item{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.note-item textarea{width:100%;min-height:72px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;line-height:1.4}
.note-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.note-dates > div{min-width:0}
.inp,.field input,.field select{min-width:0;max-width:100%}
input[type=date].inp{display:block}
.note-dates label,.note-days-lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-2)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note-foot .ctl{display:flex;gap:6px;margin-left:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.tag.live{border-color:var(--accent);color:var(--accent)}
.tag.full{color:var(--ink)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.setup{border-top:1px solid var(--line);padding-top:12px}
.setup > summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--accent);min-height:32px}
.setup .steps{margin-top:10px}
.setup code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
.topic{display:flex;align-items:center;gap:8px;margin:8px 0 4px;flex-wrap:wrap}
.topic code{font-size:15px;padding:6px 10px}
.steps .small{display:block;font-size:12px;color:var(--ink-2)}
.dash{align-self:center;color:var(--ink-2)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--ink);line-height:1.4}
.arch-grp{margin-bottom:14px}
.arch-item{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.arch-text{margin:0;font-size:15px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,127,121,.25)}100%{box-shadow:none}}
.add-btn{width:100%;min-height:50px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;font-weight:700;color:var(--accent);cursor:pointer}
.empty{color:var(--ink-2);font-size:15px;margin:0 0 12px}

/* settings: collapsible groups, each showing its current value when closed */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.grp > summary{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;list-style:none;min-height:60px}
.grp > summary::-webkit-details-marker{display:none}
.grp .gt{flex:1;min-width:0;display:grid;gap:1px}
.grp .gt b{font-size:16px}
.grp .gt span{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-body{padding:0 18px 18px}
.seg-group{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg{flex:1 1 0;min-width:0;border:0;border-right:1px solid var(--line);background:transparent;padding:10px 4px;font-size:14px;cursor:pointer;color:var(--ink);min-height:44px}
.seg:last-child{border-right:0}
.seg.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg[disabled]{cursor:not-allowed;opacity:.6}
.colors{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.color-field{display:flex;gap:8px;align-items:center}
.color-field input[type=color]{width:52px;height:44px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.color-field .hex{width:110px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:ui-monospace,Consolas,monospace;text-transform:uppercase}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{display:inline-flex;align-items:center;gap:8px}
.preset .sw{width:30px;height:18px;border-radius:5px;border:1px solid var(--line)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.color-warn p{color:var(--warn);font-size:14px;line-height:1.45;margin:0 0 12px}
.cprev{display:grid;gap:8px;padding:18px;border-radius:12px;background:var(--c-bg);border:1.5px solid rgba(var(--c-accent-rgb),.45);color:#F4EFE4;font-weight:500}
.cprev .clock{font-size:40px;font-weight:900;text-align:center;line-height:1}
.cprev .pill{justify-self:center;margin-bottom:6px;padding:3px 14px;border-radius:999px;border:1px solid rgba(var(--c-accent-rgb),.45);background:rgba(var(--c-accent-rgb),.08);color:var(--c-accent);font-size:14px;font-weight:700}
.cprev .r{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:8px;background:var(--c-surface);font-size:17px}
.cprev .r .t{font-size:22px;font-weight:700}
.cprev .r.cur{background:var(--c-surface-2);box-shadow:inset 3px 0 0 #49B9AE}
.cprev .r.next{background:var(--c-accent);color:var(--c-on-accent)}

/* screen status (top bar) and the Ekran tab */
.scr-pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.scr-dot{width:10px;height:10px;border-radius:50%;background:var(--ink-2);flex-shrink:0}
.scr-pill.on .scr-dot,.scr-item.on .scr-dot{background:#2EA36B;box-shadow:0 0 0 3px rgba(46,163,107,.2)}
.scr-pill.off .scr-dot,.scr-item.off .scr-dot{background:var(--warn)}
.scr-list{display:grid;gap:10px}
.scr-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.scr-item .scr-dot{grid-row:1}
.scr-item b{font-size:16px}
.scr-item .st{font-weight:500;color:var(--ink-2)}
.scr-item.on .st{color:#2EA36B}
.scr-item.off .st{color:var(--warn)}
.scr-item ul{grid-column:2;margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px;color:var(--ink-2)}
.scr-item li.warn{color:var(--warn)}
.scr-head{display:flex;align-items:center;gap:10px;min-width:0}
.scr-name{flex:1;min-width:0;font-weight:700;font-size:16px;min-height:40px;padding:6px 10px}
.scr-item.other{background:var(--bg)}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:13px}
.others > summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;min-height:36px}
.others .sum-note{font-weight:400;font-size:13px;color:var(--ink-2)}
.others .scr-list{margin-top:6px}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pv-head .seg-group{flex:0 0 auto;min-width:240px}
.pv-frame{position:relative;margin:0 auto;border-radius:12px;overflow:hidden;background:#0F1C33;border:1px solid var(--line)}
.pv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.pv-frame.land{width:100%;aspect-ratio:16/9}
.pv-frame.port{height:min(70vh,640px);aspect-ratio:9/16;max-width:100%}
.pv-note{margin:10px 0 0;font-size:13px;color:var(--ink-2);line-height:1.4}

/* save bar: appears at the bottom only when there is something to save or report */
.savebar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(940px,calc(100% - 32px));display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 8px 28px rgba(10,20,40,.22)}
.save-state{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.35;color:var(--ink)}
.save-state.err{color:var(--warn)}
.savebar .btn{min-height:44px}

@media (max-width:760px){
  .a-bar-in{padding:10px 16px}
  .a-bar h1{font-size:18px}
  .a-conflict{margin:0 16px 10px;padding:10px 12px;gap:8px}
  .a-conflict p{font-size:13px}
  .a-conflict-btns{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr}
  .a-conflict-btns .btn{padding:8px 6px;font-size:14px}
  .a-layout{grid-template-columns:minmax(0,1fr);gap:0;padding:16px 12px calc(150px + env(safe-area-inset-bottom,0px))}
  .a-nav{position:fixed;z-index:5;left:0;right:0;bottom:0;top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .a-nav button{flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:6px 2px;font-size:12px;text-align:center;border-radius:12px}
  .a-nav button svg{width:24px;height:24px}
  .a-nav button[aria-current="true"]{background:transparent;color:var(--accent)}
  .a-nav button:hover{background:transparent}
  .a-nav .dot-unsaved{position:absolute;top:8px;left:calc(50% + 12px);margin:0}
  .card{padding:14px 14px;border-radius:14px}
  .grp > summary{padding:14px}
  .grp-body{padding:0 14px 16px}
  .savebar{width:calc(100% - 24px);bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:8px 8px 8px 14px}
  .savebar .save-state{font-size:13px}
  .scr-pill{padding:6px 10px;font-size:13px}
  .pv-head .seg-group{flex:1 1 100%;min-width:0}
  .colors{grid-template-columns:1fr}
  .seg{font-size:13px;padding:10px 2px}
  .m-hide{display:none}
  .m-show{display:inline}
}
@media (max-width:480px){.pedit{grid-template-columns:minmax(0,1fr)}.row2:has(> .quiet){grid-template-columns:minmax(0,1fr)}}
@media (max-width:380px){.row2{grid-template-columns:1fr}.prow .nm .ar{display:none}}
@media (prefers-reduced-motion:reduce){.switch,.switch::after,.chev{transition:none}}
</style>

<body>
<section id="lock" class="chooser">
  <div class="chooser-inner">
    <h1 style="font-size:clamp(32px,6vw,48px)">Vaktija · postavke</h1>
    <p style="margin-top:8px">Unesite admin PIN.</p>
    <label for="pinEntry" style="display:block;font-size:14px;color:var(--mist);margin-bottom:8px">PIN</label>
    <input id="pinEntry" class="pin-input" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32">
    <label class="lock-check"><input type="checkbox" id="pinRemember"> Zapamti ovaj uređaj</label>
    <div class="lock-msg" id="lockMsg" aria-live="polite"></div>
    <div class="lock-row">
      <button class="lock-btn primary" id="btnUnlock" type="button">Otključaj</button>
      <a class="lock-btn" href="/" style="text-align:center;text-decoration:none">Otvori prikaz</a>
    </div>
  </div>
</section>

<section id="admin" class="admin" hidden>
  <div class="a-bar"><div class="a-bar-in">
    <div class="a-title"><h1>Vaktija</h1><span class="sub" id="aSub"></span></div>
    <button class="scr-pill" id="scrPill" type="button" hidden><span class="scr-dot"></span><span id="scrPillText"></span></button>
    <button class="btn" id="btnPreview" type="button"><span class="m-hide">Pogledaj prikaz</span><span class="m-show">Prikaz</span></button>
  </div>
  <div class="a-conflict" id="conflictBar" role="alert" hidden>
    <p id="conflictMsg"></p>
    <div class="a-conflict-btns">
      <button class="btn" id="btnTheirs" type="button">Učitaj nove postavke</button>
      <button class="btn primary" id="btnMine" type="button">Sačuvaj moje svejedno</button>
    </div>
  </div></div>
  <div class="a-layout">
    <nav class="a-nav" id="aNav" aria-label="Dijelovi postavki"></nav>
    <main class="a-main" id="aMain"></main>
  </div>
  <div class="savebar" id="saveBar" hidden>
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button class="btn" id="btnDiscard" type="button">Odbaci</button>
    <button class="btn primary" id="btnSave" type="button" disabled>Sačuvaj</button>
  </div>
</section>

<script src="/shared.js"></script>
<script>
(() => {
const PIN_KEY = "vaktija.adminPin";
let config = normalize(null);
let draft = null, dirty = false;
let pin = null;
let baseVersion = ""; // updatedAt of the server settings this page's edits are based on

/* ---------------- PIN + API ---------------- */
function storedPin(){ try{ return sessionStorage.getItem(PIN_KEY) || localStorage.getItem(PIN_KEY); }catch(e){ return null; } }
function forgetPin(){ try{ sessionStorage.removeItem(PIN_KEY); localStorage.removeItem(PIN_KEY); }catch(e){} pin = null; }
function rememberPin(p, persist){ try{ (persist ? localStorage : sessionStorage).setItem(PIN_KEY, p); }catch(e){} pin = p; }
async function login(p){
  const r = await fetch("/api/login", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({pin:p})});
  if (r.status === 429) throw Object.assign(new Error("blocked"), {code:"blocked"});
  if (r.status === 401) throw Object.assign(new Error("wrong"), {code:"wrong"});
  if (!r.ok) throw Object.assign(new Error("server"), {code:"server"});
}
// Saves settings made from version `base`; returns the new version. Throws code "conflict"
// (with the server's current version) when someone else saved in the meantime.
async function putSettings(data, base){
  const r = await fetch("/api/settings", {method:"PUT", headers:{"content-type":"application/json","x-admin-pin":pin||"","x-base-version":base||""}, body:JSON.stringify(data)});
  if (r.status === 401) throw Object.assign(new Error("auth"), {code:"auth"});
  if (r.status === 409){ const b = await r.json().catch(() => ({})); throw Object.assign(new Error("conflict"), {code:"conflict", updatedAt:b.updatedAt || ""}); }
  if (!r.ok) throw Object.assign(new Error("server"), {code:"server"});
  return (await r.json()).updatedAt || "";
}
function handleSaveError(e, fallback){
  if (e && e.code === "auth"){ forgetPin(); showLock("PIN više ne važi. Prijavite se ponovo."); return; }
  if (e && e.code === "conflict"){ setSaveState("Postavke su u međuvremenu promijenjene na drugom uređaju. Pokušajte ponovo.", true); return; }
  setSaveState(e && e.code === "server" ? fallback : "Nema veze sa serverom. Provjerite internet i pokušajte ponovo.", true);
}
function showLock(msg){
  $("admin").hidden = true; $("lock").hidden = false;
  $("pinEntry").value = ""; $("lockMsg").textContent = msg || "";
  setTimeout(() => $("pinEntry").focus(), 50);
}
async function openAdmin(){
  try{ config = await fetchSettings(); baseVersion = config.updatedAt; }
  catch(e){ $("lockMsg").textContent = "Postavke se ne mogu učitati. Provjerite internet."; return; }
  $("lock").hidden = true; $("admin").hidden = false;
  dirty = false; renderAdmin();
  startScreens();
}
async function tryUnlock(){
  const p = $("pinEntry").value.trim();
  if (!p) return;
  $("btnUnlock").disabled = true; $("lockMsg").textContent = "";
  try{
    await login(p);
    rememberPin(p, $("pinRemember").checked);
    await openAdmin();
  }catch(e){
    $("pinEntry").value = "";
    $("lockMsg").textContent = e.code === "wrong" ? "Pogrešan PIN."
      : e.code === "blocked" ? "Previše pogrešnih pokušaja. Pokušajte ponovo za 15 minuta."
      : "Nema veze sa serverom. Pokušajte ponovo.";
  }
  $("btnUnlock").disabled = false;
}
$("btnUnlock").onclick = tryUnlock;
$("pinEntry").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
function logout(){
  if (dirty && !confirm("Imate nesačuvane promjene. Odjaviti se svejedno?")) return;
  dirty = false; syncSaveBar(); hideConflict(); forgetPin(); showLock();
}
$("btnPreview").onclick = () => window.open("/", "_blank");
$("scrPill").onclick = () => { showTab("ekran", true); history.replaceState(null, "", "#ekran"); };

/* ---------------- admin ---------------- */
function setDirty(v){
  dirty = v;
  sendPreview();
  $("btnSave").disabled = !v;
  if (v) setSaveState("Nesačuvane promjene");
  else syncSaveBar();
  updateNavDots();
}
/* the save bar shows while there are unsaved changes, and briefly for a result message */
let saveMsgUntil = 0, saveMsgTimer = null;
function syncSaveBar(){
  const msg = Date.now() < saveMsgUntil;
  $("saveBar").hidden = !dirty && !msg;
  $("btnSave").hidden = $("btnDiscard").hidden = !dirty;
}
function setSaveState(t, err){
  const s = $("saveState"); s.textContent = t; s.classList.toggle("err", !!err);
  clearTimeout(saveMsgTimer);
  const ms = err ? 9000 : 4000;
  saveMsgUntil = Date.now() + ms;
  saveMsgTimer = setTimeout(syncSaveBar, ms + 50);
  syncSaveBar();
}
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
}
function field(label, input){ const id = "f"+Math.random().toString(36).slice(2,8); input.id = id; return el("div",{class:"field"}, el("label",{for:id,text:label}), input); }
function textInput(path, type="text", extra={}){
  const i = el("input", Object.assign({type}, extra));
  i.value = getPath(draft, path) ?? "";
  i.addEventListener("input", () => {
    const v = type === "number" ? (i.value === "" ? 0 : +i.value) : i.value;
    setPath(draft, path, v); setDirty(true); refreshTable();
  });
  return i;
}
function getPath(o,p){ return p.split(".").reduce((a,k)=> a==null ? a : a[k], o); }
function setPath(o,p,v){ const ks = p.split("."), last = ks.pop(); const t = ks.reduce((a,k)=> (a[k] ??= {}), o); t[last] = v; }

/* notes may take at most 3 lines on the board. Measured with the board's own font and widths
   (its notes text box: vertical 892px at 36px, horizontal ~1460px at 32px with many notes). */
const NOTE_MAX_LINES = 3;
const noteBoxes = [[892, 36, 46.8], [1460, 32, 40]].map(([w, size, lh]) => {
  const d = document.createElement("div");
  d.setAttribute("aria-hidden", "true");
  d.style.cssText = `position:absolute;left:-10000px;top:0;visibility:hidden;width:${w}px;font:600 ${size}px/${lh}px "Red Hat Display",system-ui,sans-serif;overflow-wrap:anywhere`;
  document.body.append(d);
  return {d, lh};
});
function noteLines(text){
  if (!text.trim()) return 0;
  return Math.max(...noteBoxes.map(b => { b.d.textContent = text; return Math.round(b.d.offsetHeight / b.lh); }));
}
const noteFits = text => noteLines(text) <= NOTE_MAX_LINES;
const redova = k => (k % 10 === 1 && k % 100 !== 11) ? "red" : (k % 10 >= 2 && k % 10 <= 4 && (k % 100 < 12 || k % 100 > 14)) ? "reda" : "redova";
// line counters shown next to each note; recounted once the board font has loaded
let noteLinesUpdaters = [];
if (document.fonts) document.fonts.load('600 36px "Red Hat Display"').then(() => noteLinesUpdaters.forEach(f => f())).catch(() => {});
// Keeps a note within the limit: of what was just typed or pasted, only the part that fits stays.
function limitNote(ta, prev){
  const v = ta.value;
  if (noteFits(v)) return;
  if (!noteFits(prev)){ // too long from before: may only be shortened
    if (v.length > prev.length){ const at = ta.selectionStart - (v.length - prev.length); ta.value = prev; ta.setSelectionRange(at, at); }
    return;
  }
  // the cursor sits right after what was just typed or pasted
  const end = ta.selectionEnd, tail = v.slice(end), maxP = Math.min(end, prev.length - tail.length);
  let p = 0; while (p < maxP && v[p] === prev[p]) p++;
  const head = v.slice(0, p), added = v.slice(p, end);
  let lo = 0, hi = added.length;
  while (lo < hi){ const mid = Math.ceil((lo + hi) / 2); if (noteFits(head + added.slice(0, mid) + tail)) lo = mid; else hi = mid - 1; }
  const space = added.lastIndexOf(" ", lo); // stop after a whole word where possible
  if (lo < added.length && space > 0) lo = space;
  ta.value = head + added.slice(0, lo) + tail;
  ta.setSelectionRange(p + lo, p + lo);
}

// ready-made color pairs [name, main (background), secondary (accent)]; all pass colorWarnings()
const COLOR_PRESETS = [
  ["Teget i zlatna", DEFAULTS.colors.main, DEFAULTS.colors.secondary],
  ["Zelena i zlatna", "#0B1914", "#D4AF5F"],
  ["Bordo i zlatna", "#2A1018", "#D9B77A"],
  ["Grafit i plava", "#15181D", "#5FB3D4"],
  ["Ljubičasta i zlatna", "#1C1430", "#D4AF5F"],
  ["Teget i srebrna", "#0F1C33", "#C9D3E0"]
];

const CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>';
const svg = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const signed = n => (n > 0 ? "+" : "") + n;

let timeRows = [], cityInput = null, checkSync = {}, liveTexts = [];
// keeps today's prayer list (and anything else that shows a current value) in step with the draft
function refreshTable(){
  const today = new Date(), t = dayTimes(today, draft);
  const next = KEYS.find(k => t[k].date > today);
  for (const r of timeRows){
    const k = r.k, n = prayerName(k, today, draft), x = t[k];
    r.name.textContent = n.bs; r.ar.textContent = n.ar;
    r.time.textContent = minToHHMM(x.min);
    const base = (x.official ? "zvanično " : "izračun ") + minToHHMM(x.raw), off = +draft.offsets[k] || 0;
    const mark = x.manual ? "ručno danas" : x.jumuah ? "džuma" : off ? `pomak ${signed(off)} min` : "";
    r.sub.replaceChildren(...(mark ? [el("span",{class:"mark",text:mark}), " · " + base] : [base]));
    r.row.classList.toggle("next", k === next);
    if (r.offNote) r.offNote.hidden = !x.jumuah;
  }
  $("aSub").textContent = [draft.masjidName, draft.city].filter(x => (x||"").trim()).join(" · ");
  liveTexts.forEach(f => f());
}
// on/off switch bound to a setting; the same setting may appear in two places and both stay in step
function toggle(path, title, desc){
  const i = el("input",{type:"checkbox",class:"switch",role:"switch"});
  i.checked = !!getPath(draft, path);
  (checkSync[path] ||= []).push(i);
  i.addEventListener("change", () => { setPath(draft, path, i.checked); checkSync[path].forEach(x => { x.checked = i.checked; }); setDirty(true); refreshTable(); });
  const d = desc == null ? null : el("span",{class:"d"});
  if (typeof desc === "function"){ const upd = () => { d.textContent = desc(); }; liveTexts.push(upd); upd(); }
  else if (d) d.textContent = desc;
  return el("label",{class:"sw-row"}, el("span",{class:"txt"}, el("span",{class:"t",text:title}), d), i);
}
// collapsible settings group; its closed row shows the current value
function group(id, title, summary, ...body){
  const s = el("span");
  const upd = () => { s.textContent = summary(); }; liveTexts.push(upd); upd();
  const d = el("details",{class:"grp","data-grp":id}, el("summary",{}, el("span",{class:"gt"}, el("b",{text:title}), s), svg(CHEV)), el("div",{class:"grp-body"}, ...body));
  if (openGroups.has(id)) d.open = true;
  d.addEventListener("toggle", () => { if (d.open) openGroups.add(id); else openGroups.delete(id); });
  return d;
}
let openGroups = new Set(), openRows = new Set();
const shortText = (t, n=70) => { t = (t||"").trim().replace(/\s+/g," "); return t.length > n ? t.slice(0, n-1) + "…" : t; };

function renderAdmin(){
  if (!dirty) draft = clone(config);
  timeRows = []; checkSync = {}; liveTexts = [];
  $("aSub").textContent = [draft.masjidName, draft.city].filter(x => (x||"").trim()).join(" · ");
  const main = $("aMain");
  for (const sec of [...main.children]) if (sec.dataset.tab !== "ekran") sec.remove();
  const today = new Date(), todayKey = dateKey(today);
  draft.overrides = draft.overrides || {};
  for (const k of Object.keys(draft.overrides)) if (k < todayKey) delete draft.overrides[k]; // past days

  /* ---------- Danas ---------- */
  const h = hijri(today, +draft.hijriAdjust);
  const plist = el("div",{class:"plist"});
  for (const k of KEYS){
    const ov = el("input",{type:"time",class:"inp","aria-label":`Ručno vrijeme danas za ${NAMES[k].bs}`});
    ov.value = (draft.overrides[todayKey]||{})[k] || "";
    const setOv = v => {
      const day = draft.overrides[todayKey] = draft.overrides[todayKey] || {};
      if (v) day[k] = v; else delete day[k];
      if (!Object.keys(day).length) delete draft.overrides[todayKey];
      setDirty(true); refreshTable();
    };
    ov.addEventListener("input", () => setOv(ov.value));
    const clr = el("button",{class:"btn",type:"button","aria-label":"Ukloni ručno vrijeme",text:"✕",onclick:()=>{ ov.value = ""; setOv(""); }});
    const off = textInput("offsets."+k,"number",{step:"1",inputmode:"numeric","aria-label":`Pomak svaki dan za ${NAMES[k].bs} (minuta)`});
    const bump = d => { off.value = String((+off.value||0) + d); off.dispatchEvent(new Event("input")); };
    const name = el("b"), ar = el("span",{class:"ar"}), sub = el("span",{class:"sub"}), time = el("span",{class:"tm"});
    const offNote = k === "dhuhr" ? el("p",{class:"note",text:"Petkom je džuma u fiksno vrijeme, pa se pomak tada ne primjenjuje. Ručno vrijeme i dalje ima prednost."}) : null;
    const row = el("details",{class:"prow" + (k === "sunrise" ? " minor" : "")},
      el("summary",{}, el("span",{class:"nm"}, name, ar, sub), time, svg(CHEV)),
      el("div",{class:"pedit"},
        el("div",{}, el("span",{class:"lbl",text:"Samo danas"}), el("div",{class:"timebox"}, ov, clr)),
        el("div",{}, el("span",{class:"lbl",text:"Pomak svaki dan (min)"}), el("div",{class:"stepper"},
          el("button",{type:"button","aria-label":"Minuta manje",text:"−",onclick:()=>bump(-1)}), off,
          el("button",{type:"button","aria-label":"Minuta više",text:"+",onclick:()=>bump(1)}))),
        offNote));
    if (openRows.has(k)) row.open = true;
    row.addEventListener("toggle", () => { if (row.open) openRows.add(k); else openRows.delete(k); });
    plist.append(row);
    timeRows.push({k, row, name, ar, sub, time, offNote});
  }
  main.append(el("section",{"data-tab":"danas"},
    el("div",{class:"tab-head"}, el("h2",{text:"Danas"}),
      el("p",{text:gregorian(today) + (h ? ` · ${h.day}. ${H_MONTHS[h.mon-1]} ${h.yr}. h.` : "")})),
    el("div",{class:"card"},
      el("h3",{text:"Vremena na ekranu"}),
      el("p",{class:"hint",text:"Dodirnite namaz da upišete vrijeme samo za danas ili stalni pomak u minutama."}),
      plist),
    el("div",{class:"card"},
      el("h3",{text:"Brzo uključi / isključi"}),
      el("p",{class:"hint",text:"Promjene se vide na ekranu kad ih sačuvate."}),
      toggle("announcement.on","Najava preko cijelog ekrana", () => (draft.announcement.text||"").trim() ? shortText(draft.announcement.text) : "Nema teksta. Upišite ga pod Obavijesti."),
      toggle("jumuah.on","Džuma petkom","Petkom podne kao Džuma u 12:00 (zimsko) ili 13:00 (ljetno vrijeme)."),
      toggle("night.on","Noćni način","Ekran se zatamni između jacije i zore."))
  ));

  /* ---------- Obavijesti ---------- */
  const annText = el("textarea",{"aria-label":"Tekst najave"}); annText.value = draft.announcement.text || "";
  annText.addEventListener("input", () => { draft.announcement.text = annText.value; setDirty(true); refreshTable(); });
  const DAY_SHORT = [["P",1,"ponedjeljak"],["U",2,"utorak"],["S",3,"srijeda"],["Č",4,"četvrtak"],["P",5,"petak"],["S",6,"subota"],["N",0,"nedjelja"]];
  const list = el("ul",{class:"notes"}), archList = el("ul",{class:"notes arch"});
  const archSum = el("span"), archBox = el("details",{class:"grp arch-grp"});
  const todayK = dateKey(new Date());
  const expired = n => !!(n.to && todayK > n.to);
  const ARCHIVE_MAX = 30;
  let focusNote = null;
  const fmtDay = k => { const [y, m, d] = k.split("-"); return `${+d}.${+m}.${y}.`; };
  const drawNotes = () => {
    list.textContent = ""; noteLinesUpdaters = [];
    const shown = draft.notes.map((n, i) => i).filter(i => !expired(draft.notes[i]));
    if (!shown.length) list.append(el("p",{class:"empty",text:"Nema obavijesti. Dodajte prvu i ona će se prikazati na dnu ekrana."}));
    shown.forEach((i, pos) => {
      const n = draft.notes[i];
      n.days = Array.isArray(n.days) ? n.days : [];
      const ta = el("textarea",{"aria-label":`Obavijest ${pos+1}`,placeholder:"Tekst obavijesti"}); ta.value = n.text || "";
      const status = el("span",{class:"tag"});
      const setStatus = () => { const live = noteActive(n, new Date()); status.textContent = live ? "Prikazuje se danas" : expired(n) ? "Isteklo (prelazi u arhivu)" : "Danas se ne prikazuje"; status.classList.toggle("live", live); };
      const lines = el("span",{class:"tag"});
      const setLines = () => {
        const k = noteLines(ta.value), over = k > NOTE_MAX_LINES;
        lines.textContent = over ? `Preduga: ${k} ${redova(k)}, vide se samo ${NOTE_MAX_LINES}. Skratite je.` : `${k}/${NOTE_MAX_LINES} reda`;
        lines.classList.toggle("warn", over);
        lines.classList.toggle("full", k === NOTE_MAX_LINES);
      };
      ta.addEventListener("input", () => { limitNote(ta, n.text || ""); if (ta.value === (n.text || "")){ setLines(); return; } n.text = ta.value; setDirty(true); setStatus(); setLines(); });
      noteLinesUpdaters.push(setLines);
      // moves past the hidden (expired) notes, so the visible order changes by one step
      const mv = (d) => { const j = shown[pos + d]; if (j === undefined) return; [draft.notes[i],draft.notes[j]] = [draft.notes[j],draft.notes[i]]; setDirty(true); drawNotes(); };
      const fid = "nf"+i, tid = "nt"+i;
      const from = el("input",{type:"date",class:"inp",id:fid}); from.value = n.from || "";
      const to = el("input",{type:"date",class:"inp",id:tid}); to.value = n.to || "";
      from.addEventListener("input", () => { n.from = from.value; setDirty(true); setStatus(); });
      to.addEventListener("input", () => { n.to = to.value; setDirty(true); setStatus(); });
      const days = el("div",{class:"days",role:"group","aria-label":"Samo ovim danima"});
      for (const [lbl, d, full] of DAY_SHORT){
        const btn = el("button",{type:"button",class:"day"+(n.days.includes(d)?" on":""),title:full,"aria-label":full,"aria-pressed":String(n.days.includes(d)),text:lbl});
        btn.addEventListener("click", () => {
          const k = n.days.indexOf(d); if (k >= 0) n.days.splice(k,1); else n.days.push(d);
          btn.classList.toggle("on"); btn.setAttribute("aria-pressed", String(n.days.includes(d))); setDirty(true); setStatus();
        });
        days.append(btn);
      }
      setStatus(); setLines();
      // removing keeps a copy in the archive (an empty note just goes)
      const remove = () => {
        draft.notes.splice(i, 1);
        if ((n.text||"").trim()) draft.archive = [{id:n.id || Date.now().toString(36), text:n.text, days:n.days, archivedAt:todayK}, ...(draft.archive || [])].slice(0, ARCHIVE_MAX);
        setDirty(true); drawNotes();
      };
      list.append(el("li",{"data-id":n.id||""}, el("div",{class:"note-item"},
        ta,
        el("div",{class:"note-dates"},
          el("div",{}, el("label",{for:fid,text:"Prikazuj od"}), from),
          el("div",{}, el("label",{for:tid,text:"do"}), to)),
        el("div",{}, el("span",{class:"note-days-lbl",text:"Samo ovim danima (neobavezno)"}), days),
        el("div",{class:"note-foot"}, status, lines, el("div",{class:"ctl"},

/* ---------------- Ekran: screen status and live preview ---------------- */
const ONLINE_MS = 12 * 60000; // screens report every 5 minutes; two missed reports = offline
let screens = null, screensAt = 0, screensTimer = null, alertsSince = null;
async function loadScreens(){
  if (!pin || $("admin").hidden) return;
  try{
    const r = await fetch("/api/screens", {headers:{"x-admin-pin":pin}, cache:"no-store"});
    if (!r.ok) return;
    const d = await r.json();
    screens = Object.entries(d.screens || {}).map(([id, x]) => ({...x, id})).sort((a, b) => Date.parse(a.first) - Date.parse(b.first));
    alertsSince = d.alertsSince || "";
    screensAt = Date.now() - Date.parse(d.now); // server clock vs this device
  }catch(e){ return; }
  renderScreens();
}
const nowServer = () => Date.now() - screensAt;
function ago(iso){
  const t = Date.parse(iso); if (!t) return "";
  const m = Math.round((nowServer() - t) / 60000), d = new Date(t);
  if (m < 1) return "upravo sada";
  if (m < 60) return `prije ${m} min`;
  if (m < 6*60) return `prije ${Math.floor(m/60)} h ${m%60 ? (m%60) + " min" : ""}`.trim();
  return dateKey(d) === dateKey(new Date()) ? `danas u ${pad(d.getHours())}:${pad(d.getMinutes())}` : `${d.getDate()}.${d.getMonth()+1}. u ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const OTHER_HIDE_MS = 24 * 3600e3; // unmarked devices drop off the list after a day of silence
let othersOpen = false;
const labels = () => (draft || config).screenLabels || {};
// which devices count: the ones marked as screens; until one is marked, every device that
// reported in the last day (the first setup case)
function screenGroups(){
  const L = labels(), marked = screens.filter(x => L[x.id] !== undefined);
  const recent = x => nowServer() - Date.parse(x.at) < OTHER_HIDE_MS;
  const others = screens.filter(x => L[x.id] === undefined && recent(x));
  return marked.length ? {main:marked, others, marked:true} : {main:others, others:[], marked:false};
}
function renderScreens(){
  const pill = $("scrPill"), list = $("scrList");
  if (screens === null){ pill.hidden = true; return; }
  const {main, others, marked} = screenGroups();
  const isOn = x => nowServer() - Date.parse(x.at) < ONLINE_MS;
  const online = main.filter(isOn);
  pill.hidden = false;
  pill.className = "scr-pill " + (online.length ? "on" : main.length ? "off" : "");
  $("scrPillText").textContent = online.length ? (main.length > 1 ? `Ekrani uživo: ${online.length}/${main.length}` : "Ekran uživo") : main.length ? "Ekran van mreže" : "Ekran nije javljen";
  pill.title = "Stanje ekrana u džamiji";
  const conn = $("alertConn");
  if (conn && alertsSince !== null){
    conn.className = "tag" + (alertsSince ? " live" : "");
    conn.textContent = alertsSince ? `Povezano od ${ago(alertsSince)}` : "Još nije povezano";
  }
  if (!list || list.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return; // don't redraw while typing a name
  if (!main.length && !others.length){
    list.replaceChildren(el("p",{class:"empty",text:"Nijedan ekran se još nije javio. Ekran se javlja svakih 5 minuta nakon što učita najnoviju verziju prikaza (svake noći oko 03:30, ili odmah ako osvježite stranicu na TV-u)."}));
    return;
  }
  const setLabel = (id, name) => {
    draft.screenLabels = {...(draft.screenLabels || {})};
    if (name === null) delete draft.screenLabels[id]; else draft.screenLabels[id] = name;
    setDirty(true); renderScreens();
  };
  const detail = (x, withName) => [withName ? (x.device || "Nepoznat uređaj") : "", x.w && x.h ? `${x.w}×${x.h}` : "", x.layout].filter(Boolean).join(" · ");
  const item = (x, i, kind) => {
    const on = isOn(x), latest = x.version && x.version === config.updatedAt, L = labels();
    const items = [
      el("li",{text:detail(x, kind === "marked")}),
      el("li",{text:`Zadnji put se javio ${ago(x.at)}` + (x.since ? ` · učitan ${ago(x.since)}` : "")})
    ];
    if (kind !== "other") items.push(el("li",{class: latest || !on ? "" : "warn", text: latest ? (on ? "Prikazuje zadnje sačuvane postavke" : "Imao je zadnje sačuvane postavke") : on ? "Još prikazuje starije postavke; nove preuzima u roku od par minuta" : "Prikazivao je postavke sačuvane prije zadnje izmjene"}));
    if (kind === "marked" && !on) items.push(el("li",{class:"warn",text:"Provjerite da li su TV i internet u džamiji uključeni."}));
    let head;
    if (kind === "marked"){
      const name = el("input",{type:"text",class:"inp scr-name",maxlength:"40","aria-label":"Naziv ekrana",placeholder:"Naziv ekrana"});
      name.value = L[x.id] || "";
      name.addEventListener("input", () => { draft.screenLabels = {...draft.screenLabels, [x.id]: name.value}; setDirty(true); });
      name.addEventListener("blur", () => renderScreens());
      head = el("div",{class:"scr-head"}, name, el("span",{class:"st",text: on ? "uživo" : "van mreže"}));
      items.push(el("li",{}, el("button",{class:"linkbtn",type:"button",text:"Ovo nije ekran u džamiji",onclick:()=>setLabel(x.id, null)})));
    } else {
      head = el("div",{}, el("b",{text: x.device || (main.length > 1 && kind !== "other" ? `Uređaj ${i+1}` : "Nepoznat uređaj")}), " ", el("span",{class:"st",text: on ? "· uživo" : "· van mreže"}));
      const n = Object.keys(L).length;
      items.push(el("li",{}, el("button",{class:"btn small primary",type:"button",text:"Ovo je ekran u džamiji",onclick:()=>setLabel(x.id, n ? `Ekran ${n+1}` : "Ekran u džamiji")})));
    }
    return el("div",{class:"scr-item " + (on ? "on" : "off") + (kind === "other" ? " other" : "")},
      el("span",{class:"scr-dot"}), head, el("ul",{}, ...items));
  };
  const out = [];
  if (!marked) out.push(el("p",{class:"hint",style:"margin:0",text:"Označite koji uređaj je ekran u džamiji. Tada se prate samo označeni ekrani, a telefoni i računari na kojima ste otvarali prikaz prelaze u „Drugi uređaji” i nestaju nakon jednog dana."}));
  out.push(...main.map((x, i) => item(x, i, marked ? "marked" : "candidate")));
  if (others.length){
    const d = el("details",{class:"others"}, el("summary",{}, `Drugi uređaji (${others.length})`, el("span",{class:"sum-note",text:" · nestaju nakon jednog dana bez javljanja"})),
      el("div",{class:"scr-list"}, ...others.map((x, i) => item(x, i, "other"))));
    d.open = othersOpen; d.addEventListener("toggle", () => { othersOpen = d.open; });
    out.push(d);
  }
  list.replaceChildren(...out);
}

/* offline alert: settings here, the check itself runs in a Cloudflare Worker (worker/alert.js) */
const TOPIC_KEY = "vaktija.ntfyTopic";
function ntfyTopic(){
  let t = store.get(TOPIC_KEY);
  if (!/^vaktija-[a-z0-9]{12}$/.test(t || "")){
    const r = new Uint8Array(12); crypto.getRandomValues(r);
    t = "vaktija-" + [...r].map(b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join(""); store.set(TOPIC_KEY, t);
  }
  return t;
}

  const time = key => { const i = el("input",{type:"time",class:"inp"}); i.value = draft.alerts[key] || ""; i.addEventListener("input", () => { draft.alerts[key] = i.value; setDirty(true); }); return i; };
  const topic = ntfyTopic();

      el("li",{}, "U postavkama Workera, ", el("b",{text:"Bindings → Add → KV namespace"}), ": ime ", el("code",{text:"VAKTIJA"}), ", namespace ", el("code",{text:"vaktija-settings"}), "."),
      el("li",{}, el("b",{text:"Variables and Secrets → Add"}), ": tip Secret, ime ", el("code",{text:"NTFY_TOPIC"}), ", vrijednost je tema iz prvog koraka. Po želji dodajte i tekst ", el("code",{text:"ADMIN_URL"}), " = ", el("code",{text:location.origin + "/admin/#ekran"}), "."),
      el("li",{}, el("b",{text:"Settings → Trigger events → Add → Cron"}), ": svakih 10 minuta (", el("code",{text:"*/10 * * * *"}), ")."),
      el("li",{text:"U roku od 10 minuta na telefon stiže poruka da su obavještenja uključena, a ovdje piše „Povezano”."})));

let pvOrient = null, pvFrame = null, pvTimer = null;
function buildEkranTab(){
  const seg = el("div",{class:"seg-group",role:"group","aria-label":"Raspored pregleda",id:"pvSeg"});
  for (const [v, t] of [["horizontalno","Horizontalno"],["vertikalno","Vertikalno"]])
    seg.append(el("button",{type:"button",class:"seg","data-v":v,text:t,onclick:()=>{ pvOrient = v; ensurePreview(true); }}));
  return el("section",{"data-tab":"ekran",id:"tabEkran"},
    el("div",{class:"tab-head"}, el("h2",{text:"Ekran"}), el("p",{text:"Da li je ekran u džamiji uključen i kako izgleda prikaz."})),
    el("div",{class:"card"},
      el("h3",{text:"Stanje"}),
      el("p",{class:"hint",text:"Ekran se javlja svakih 5 minuta. Ako se ne javi duže od 12 minuta, prikazuje se kao van mreže. Uređaji na kojima je zapamćen PIN za admin se ne javljaju."}),
      el("div",{class:"scr-list",id:"scrList"})),
    el("div",{id:"alertsSlot"}),
    el("div",{class:"card"},
      el("div",{class:"pv-head"}, el("h3",{text:"Pregled",style:"margin:0"}), seg),
      el("div",{class:"pv-frame land",id:"pvBox"}),
      el("p",{class:"pv-note",id:"pvNote"})));
}
// creates the preview frame the first time the tab is opened (or again when the layout changes)
function ensurePreview(force){
  const box = $("pvBox"); if (!box) return;
  if (!pvOrient) pvOrient = ["portrait","rotate"].includes(config.orientation) ? "vertikalno" : "horizontalno";
  for (const b of $("pvSeg").children){ const on = b.dataset.v === pvOrient; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }
  box.className = "pv-frame " + (pvOrient === "vertikalno" ? "port" : "land");
  if (pvFrame && !force) return;
  box.textContent = "";
  pvFrame = el("iframe",{src:`/?pregled=1&raspored=${pvOrient}`,title:"Pregled ekrana",loading:"eager",tabindex:"-1"});
  box.append(pvFrame);
  updatePvNote();
}
function updatePvNote(){
  const n = $("pvNote"); if (!n) return;
  n.textContent = dirty ? "Pregled prikazuje i vaše nesačuvane promjene. Na ekranu u džamiji pojavit će se kad ih sačuvate."
                        : "Ovako trenutno izgleda prikaz sa sačuvanim postavkama.";
}
function sendPreview(){
  updatePvNote();
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => {
    if (!pvFrame || !pvFrame.contentWindow || !draft) return;
    pvFrame.contentWindow.postMessage({type:"vaktija-preview", config:JSON.parse(JSON.stringify(draft))}, location.origin);
  }, 150);
}
window.addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.type === "vaktija-preview-ready") sendPreview(); });

/* tabs; the choice is kept in the address (#obavijesti). Old section links still land in the right tab. */
const TABS = [
  ["danas", "Danas", ["offsets","overrides","jumuah"], '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'],
  ["obavijesti", "Obavijesti", ["notes","archive","announcement"], '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>'],
  ["ekran", "Ekran", ["alerts","screenLabels"], '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'],
  ["podesavanja", "Podešavanja", ["masjidName","city","lat","lng","source","cityIndex","asrFactor","hijriAdjust","fajrAngle","ishaAngle","noteSeconds","showSeconds","night","colors"], '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>']
];
const OLD_SECTIONS = {vremena:"danas", najava:"obavijesti", dzamija:"podesavanja", izvor:"podesavanja", nocni:"podesavanja", boje:"podesavanja"};
const tabFromHash = () => { const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : (OLD_SECTIONS[h] || null); };
let activeTab = tabFromHash() || TABS[0][0];
function buildNav(){
  const nav = $("aNav"); nav.textContent = "";
  for (const [id, label, , icon] of TABS){
    nav.append(el("button",{type:"button","data-tab":id,onclick:()=>{ showTab(id, true); history.replaceState(null, "", "#" + id); }},
      svg(icon), el("span",{text:label})));
  }
  showTab(activeTab);
  updateNavDots();
}
function showTab(id, picked){
  activeTab = id;
  for (const s of document.querySelectorAll("#aMain [data-tab]")) s.hidden = s.dataset.tab !== id;
  for (const b of $("aNav").children) b.setAttribute("aria-current", String(b.dataset.tab === id));
  if (id === "ekran"){ ensurePreview(); loadScreens(); }
  if (picked) window.scrollTo(0, 0);
}
// a dot on tabs whose settings differ from the saved ones
function sectionChanged(keys){
  const today = dateKey(new Date());
  const pick = (o, k) => k === "overrides" ? Object.fromEntries(Object.entries(o[k] || {}).filter(([d]) => d >= today)) : o[k];
  return keys.some(k => JSON.stringify(pick(draft, k)) !== JSON.stringify(pick(config, k)));
}
function updateNavDots(){
  if (!draft) return;
  for (const b of $("aNav").children){
    const keys = TABS.find(t => t[0] === b.dataset.tab)[2], changed = dirty && keys.length > 0 && sectionChanged(keys);
    let dot = b.querySelector(".dot-unsaved");
    if (changed && !dot) b.append(el("span",{class:"dot-unsaved",title:"Nesačuvane promjene","aria-label":"nesačuvane promjene"}));
    else if (!changed && dot) dot.remove();
  }
}
window.addEventListener("hashchange", () => { const id = tabFromHash(); if (id) showTab(id); });
// keeps the laptop menu just below the sticky top bar, whose height changes (conflict notice)
if (window.ResizeObserver) new ResizeObserver(([e]) => document.documentElement.style.setProperty("--bar-h", e.target.offsetHeight + "px")).observe(document.querySelector(".a-bar"));

const ORIENTS = [["auto","Automatski","Prati oblik ekrana"],["landscape","Horizontalno","Uvijek horizontalni raspored"],["portrait","Vertikalno","Uvijek vertikalni raspored"],["rotate","Zarotirano","Vertikalno, slika okrenuta za 90° za TV koji ne može sam rotirati prikaz"]];
let orientBusy = false;
let orientBox = null;
function renderOrientSwitch(){
  const box = orientBox; if (!box) return; box.textContent = "";
  const cur = config.orientation || "auto";
  for (const [v,t,tip] of ORIENTS){
    box.append(el("button",{type:"button",class:"seg"+(cur===v?" on":""),"aria-pressed":String(cur===v),title:tip,text:t,
      onclick:()=>setOrientation(v)}));
  }
  for (const b of box.children) b.disabled = orientBusy;
}
async function setOrientation(v){
  if (orientBusy || (config.orientation||"auto") === v) return;
  orientBusy = true; renderOrientSwitch();
  setSaveState("Mijenjam raspored…");
  try{
    const done = `Raspored: ${ORIENTS.find(o=>o[0]===v)[1].toLowerCase()}. Ekran se ažurira za najviše minutu.`;
    try{
      const next = Object.assign(clone(config), {orientation:v});
      next.updatedAt = await putSettings(next, baseVersion);
      config = next; baseVersion = next.updatedAt; if (draft) draft.orientation = v;
      liveTexts.forEach(f => f());
      setSaveState(done);
    }catch(e){
      if (e.code !== "conflict") throw e;
      // saved elsewhere meanwhile: put the new layout on top of the latest settings instead
      const latest = await fetchSettings(), next = Object.assign(clone(latest), {orientation:v});
      next.updatedAt = await putSettings(next, latest.updatedAt);
      config = next;
      if (!dirty){ baseVersion = next.updatedAt; renderAdmin(); setSaveState(done + " Učitane su i promjene sačuvane na drugom uređaju."); }
      else { draft.orientation = v; setSaveState(done); } // unsaved edits stay; saving them will show the conflict notice
    }
  }catch(e){ handleSaveError(e, "Promjena rasporeda nije uspjela. Pokušajte ponovo."); }
  orientBusy = false; renderOrientSwitch();
}
// base: the version these edits are based on; "save mine anyway" passes the newer one
async function saveDraft(base){
  const payload = normalize(draft);
  payload.notes = payload.notes.filter(n => (n.text||"").trim());
  payload.archive = payload.archive.filter(n => (n.text||"").trim());
  $("btnSave").disabled = true; $("btnMine").disabled = true; setSaveState("Spremanje…");
  try{
    const v = await putSettings(payload, base);
    dirty = false; config = normalize(payload); config.updatedAt = baseVersion = v;
    hideConflict(); renderAdmin();
    setSaveState("Sačuvano. Ekran se ažurira za najviše minutu.");
  }catch(e){
    if (e.code === "conflict"){ showConflict(e.updatedAt); setSaveState("Nije sačuvano.", true); }
    else handleSaveError(e, "Spremanje nije uspjelo. Pokušajte ponovo.");
    $("btnSave").disabled = false;
  }
  $("btnMine").disabled = false;
}
$("btnSave").onclick = () => saveDraft(baseVersion);
$("btnDiscard").onclick = () => {
  if (!confirm("Odbaciti sve nesačuvane promjene?")) return;
  dirty = false; hideConflict(); renderAdmin(); setSaveState("Promjene su odbačene.");
};

/* someone else saved since this page loaded its settings */
let conflictVersion = "";
function showConflict(version){
  conflictVersion = version;
  const d = version ? new Date(version) : null, today = d && dateKey(d) === dateKey(new Date());
  const when = d && !isNaN(d) ? ` (${today ? "danas" : `${d.getDate()}.${d.getMonth()+1}.`} u ${pad(d.getHours())}:${pad(d.getMinutes())})` : "";
  $("conflictMsg").textContent = `Postavke su u međuvremenu sačuvane na drugom uređaju${when}, pa vaše promjene nisu sačuvane. ` +
    "Učitajte nove (vaše promjene se odbacuju) ili sačuvajte svoje preko njih.";
  $("conflictBar").hidden = false;
}
function hideConflict(){ $("conflictBar").hidden = true; conflictVersion = ""; }
$("btnMine").onclick = () => saveDraft(conflictVersion);
$("btnTheirs").onclick = async () => {
  $("btnTheirs").disabled = true;
  try{
    config = await fetchSettings(); baseVersion = config.updatedAt;
    dirty = false; hideConflict(); renderAdmin();
    setSaveState("Učitane su nove postavke.");
  }catch(e){ setSaveState("Nema veze sa serverom. Provjerite internet i pokušajte ponovo.", true); }
  $("btnTheirs").disabled = false;
};
window.addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });


/* ---------------- boot ---------------- */
(async () => {
  const p = storedPin();
  if (!p){ showLock(); return; }
  try{ await login(p); pin = p; await openAdmin(); }
  catch(e){ if (e.code === "wrong") forgetPin(); showLock(e.code === "wrong" ? "PIN je promijenjen. Unesite novi." : ""); }
})();
})();
